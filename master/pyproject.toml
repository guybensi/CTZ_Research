[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ctz-flux1km"
version = "0.1.0"
description = "Infrastructure for a 1 km all-sky TOA flux map from MODIS, anchored to CERES (see PLAN.md)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
# scikit-learn: tree models (M1-gbm, M4, M9); pandas: reading ceres_psf.csv
dev = ["pytest>=7", "ruff>=0.4", "scikit-learn>=1.3", "pandas>=1.5"]
# neural methods (M0 ANNs, M1-ann, M3, M5, M6a-d, M6f); the GPU Docker image installs this extra
ml = ["torch>=2.2", "scikit-learn>=1.3", "pandas>=1.5"]

[tool.setuptools]
packages = ["flux1km", "flux1km.methods"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--doctest-modules --import-mode=importlib"
# doctests live in flux1km/; collect them with: pytest flux1km tests

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E702", "B905"]  # compact test fixtures; zip(strict=) is noise for paired numpy arrays
